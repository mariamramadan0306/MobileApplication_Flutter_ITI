<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      math {
        color: red;
      }
    </style>
  </head>
  <body>
    <svg width="200" height="110">
      <text x="125" y="110" font-size="10">a</text>
      <text x="165" y="67" font-size="10">b</text>
      <text x="115" y="65" font-size="10">c</text>
      <polygon
        points=" 100,100 160,100 160,20"
        stroke="red"
        stroke-width="3"
        fill="red"
      ></polygon>
    </svg>
    <p>According to the pythagoras theorem</p>
    <math>
      <mi>C</mi>
      <mo>=</mo>
      <msqrt>
        <msup>
          <mrow>
            <mi>a</mi>
          </mrow>
          <mrow>
            <mn>2</mn>
          </mrow>
        </msup>
        <mo>+</mo>
        <msup>
          <mrow>
            <mi>b</mi>
          </mrow>
          <mrow>
            <mn>2</mn>
          </mrow>
        </msup>
      </msqrt>
    </math>
  </body>
</html>
