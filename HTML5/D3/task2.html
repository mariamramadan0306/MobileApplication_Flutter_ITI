<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>task2</title>
    <style>
      p {
        margin-top: 0;
        color: gray;
      }
      input:valid + p {
        display: none;
      }
      input:valid {
        margin-bottom: 50px;
      }

      input:invalid + p {
        display: block;
      }

      input:invalid {
        border: 2px solid red;
        border-radius: 5px;
      }

      button {
        margin-left: 50px;
      }
    </style>
  </head>
  <body>
    <h1>Change Email Address</h1>
    <form>
      <input type="text" placeholder="Username" required pattern="[A-Za-z]*" />
      <p>The required username may only be series of alphabetical characters</p>
      <br />
      <input
        type="email"
        placeholder="Email"
        required
        pattern="[A-Za-z0-9 @]*"
      />
      <p>
        The required email address may not include any special characters other
        than '@' sign
      </p>
      <br />
      <button>change</button>
    </form>
  </body>
</html>
